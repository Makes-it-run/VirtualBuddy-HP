name: IndexNow

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "One published sitemap URL for a verification test (leave empty for submit_all)"
        required: false
        default: ""
        type: string
      submit_all:
        description: "Submit all URLs from the published sitemap"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: read
  actions: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify-indexnow:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run IndexNow regression tests
        run: python -m unittest discover -s .github/scripts/tests -v
      - name: Verify deployment and notify IndexNow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REQUESTED_URL: ${{ inputs.url }}
          SUBMIT_ALL: ${{ inputs.submit_all }}
          ACK_PATH: ${{ runner.temp }}/indexnow-accepted.json
        run: python .github/scripts/indexnow.py
      - name: Record the fully accepted deployment
        if: success() && (github.event_name == 'workflow_run' || inputs.submit_all == true)
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-accepted-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/indexnow-accepted.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
